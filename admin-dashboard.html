<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Listing Management | Phuket VIP Concierge</title>
  <link rel="stylesheet" href="/css/style.css?v=20260821_v14_hd_slider">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #110D09; color: #ffffff; }
    .glass-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.25rem; }
    .form-input, .form-select, .form-textarea { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); color: white; padding: 0.7rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; outline: none; width: 100%; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #DF921B; }
  </style>
</head>
<body class="bg-[#110D09] text-white min-h-screen selection:bg-[#DF921B] selection:text-black">

  <!-- Admin Top Bar -->
  <nav class="w-full h-20 border-b border-white/10 px-6 sm:px-10 flex items-center justify-between">
    
  <div class="flex items-center gap-3">
    <div class="h-10 w-10 rounded-full overflow-hidden bg-[#1C140E] border border-[#DF921B]/40 shadow-sm flex items-center justify-center p-0.5">
      <img src="/public/images/logo.png?v=20260821_logo2" alt="Logo" class="w-full h-full object-cover rounded-full scale-125">
    </div>
    <div>
      <span class="font-bold text-sm uppercase block">Phuket VIP Concierge</span>
      <span class="text-[10px] text-zinc-400">Back-Office Management</span>
    </div>
  </div>

    
    <div class="flex items-center gap-4">
      <a href="/index.html" target="_blank" class="text-xs text-[#DF921B] hover:underline font-semibold">🌐 View Live Website ↗</a>
      <button id="btn-logout" class="text-xs bg-red-500/20 text-red-300 hover:bg-red-500/30 px-3 py-1.5 rounded-lg font-bold transition">Logout</button>
    </div>
  </nav>

  <!-- Admin Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold">Property Listings</h1>
        <p class="text-xs text-zinc-400 mt-1">Manage catalog listings in real-time.</p>
      </div>
      <button id="btn-open-add-modal" class="btn-gold px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg">
        + Add New Property
      </button>
    </div>

    <!-- Properties Table -->
    <div class="glass-box overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-zinc-300">
          <thead class="bg-white/5 uppercase text-zinc-400 font-bold border-b border-white/10">
            <tr>
              <th class="p-4">Property</th>
              <th class="p-4">Type</th>
              <th class="p-4">District</th>
              <th class="p-4">Purpose</th>
              <th class="p-4">Price (THB)</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-prop-table-body" class="divide-y divide-white/5">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Add / Edit Property Modal -->
  <div id="modal-property" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#110D09] border border-white/15 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl my-8 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-6">
        <h3 class="text-lg font-bold" id="modal-title">Add Property</h3>
        <button type="button" id="btn-close-modal" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center">✕</button>
      </div>

      <form id="property-form" class="space-y-4">
        <input type="hidden" id="form-prop-id">
        
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1">Title</label>
          <input type="text" id="form-title" required class="form-input" placeholder="Luxury Seaview Villa Bang Tao">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Type</label>
            <select id="form-type" class="form-select">
              <option value="Villa">Villa</option>
              <option value="Condo">Condominium</option>
              <option value="Penthouse">Penthouse</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Purpose</label>
            <select id="form-purpose" class="form-select">
              <option value="buy">For Sale (Buy)</option>
              <option value="rent">For Rent</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">District</label>
            <input type="text" id="form-district" required class="form-input" placeholder="Bang Tao">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Price (THB)</label>
            <input type="number" id="form-price" required class="form-input" placeholder="25000000">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Bedrooms</label>
            <input type="number" id="form-bedrooms" value="3" class="form-input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Bathrooms</label>
            <input type="number" id="form-bathrooms" value="3" class="form-input">
          </div>
        </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Max Guests (Capacité)</label>
            <input type="number" id="form-guests" value="4" class="form-input" placeholder="ex: 8">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Total Beds (Lits)</label>
            <input type="number" id="form-beds" value="2" class="form-input" placeholder="ex: 4">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Rating (Note sur 5)</label>
            <input type="number" step="0.01" id="form-rating" value="4.9" class="form-input" placeholder="ex: 4.95">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Reviews Count (Nb Avis)</label>
            <input type="number" id="form-review-count" value="12" class="form-input" placeholder="ex: 24">
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-bold text-zinc-300">Galerie Photos (Glisser-Déposer ou Réorganiser l'ordre)</label>
            <span class="text-[11px] text-[#DF921B] font-semibold" id="photo-manager-count">0 photos</span>
          </div>
          
          <!-- Interactive Drag & Drop Reorder Container -->
          <div id="photo-reorder-grid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2.5 p-3 bg-black/40 border border-white/10 rounded-2xl min-h-[120px] max-h-[260px] overflow-y-auto">
            <!-- Dynamic Draggable Photo Items -->
          </div>

          <div class="flex gap-2">
            <input type="text" id="form-image-input" placeholder="Ajouter une URL d'image (ex: https://...)" class="form-input text-xs">
            <button type="button" id="btn-add-photo" class="btn-outline-gold px-4 rounded-xl text-xs font-bold whitespace-nowrap">+ Ajouter</button>
          </div>
          <input type="hidden" id="form-image" value="">
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1">Description</label>
          <textarea id="form-desc" rows="3" class="form-textarea" placeholder="Stunning luxury property with private pool..."></textarea>
        </div>

        <div class="flex items-center gap-6 pt-2">
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer">
            <input type="checkbox" id="form-pool" checked class="w-4 h-4 rounded text-[#DF921B]">
            <span>Private Pool</span>
          </label>
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer">
            <input type="checkbox" id="form-seaview" class="w-4 h-4 rounded text-[#DF921B]">
            <span>Sea View</span>
          </label>
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer">
            <input type="checkbox" id="form-parking" checked class="w-4 h-4 rounded text-[#DF921B]">
            <span>Private Parking</span>
          </label>
        </div>

        <div class="pt-4 border-t border-white/10 flex justify-end gap-3">
          <button type="button" id="btn-cancel" class="px-5 py-2.5 rounded-xl border border-white/20 text-xs font-bold hover:bg-white/10">Cancel</button>
          <button type="submit" class="btn-gold px-6 py-2.5 rounded-xl font-bold text-xs">Save Listing</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js?v=20260822_v21_unlimited_photos_reorder"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check auth
      if (localStorage.getItem('pvc_admin_auth') !== 'true') {
        window.location.href = '/admin.html';
        return;
      }

      document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('pvc_admin_auth');
        window.location.href = '/admin.html';
      });

      const tableBody = document.getElementById('admin-prop-table-body');
      const modal = document.getElementById('modal-property');
      const btnOpenAdd = document.getElementById('btn-open-add-modal');
      const btnCloseModal = document.getElementById('btn-close-modal');
      const btnCancel = document.getElementById('btn-cancel');
      const form = document.getElementById('property-form');

      let currentFormImages = [];

      function renderPhotoReorderGrid() {
        const grid = document.getElementById('photo-reorder-grid');
        const counter = document.getElementById('photo-manager-count');
        const hiddenInput = document.getElementById('form-image');
        if (!grid) return;

        counter.textContent = `${currentFormImages.length} photos`;
        hiddenInput.value = currentFormImages.join(',');

        if (currentFormImages.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full flex flex-col items-center justify-center py-6 text-zinc-500 text-xs">
              <span>Aucune photo. Ajoutez des URLs ou glissez des photos ci-dessous.</span>
            </div>
          `;
          return;
        }

        grid.innerHTML = currentFormImages.map((src, idx) => `
          <div class="relative group aspect-square rounded-xl overflow-hidden border ${idx === 0 ? 'border-[#DF921B] ring-2 ring-[#DF921B]/40' : 'border-white/10'} bg-black cursor-move photo-draggable-item" draggable="true" data-idx="${idx}">
            <img src="${src}" class="w-full h-full object-cover pointer-events-none" loading="lazy">
            
            ${idx === 0 ? `<span class="absolute top-1 left-1 bg-[#DF921B] text-black text-[9px] font-black px-1.5 py-0.5 rounded shadow">★ PRINCIPALE</span>` : ''}
            
            <!-- Floating order & control buttons -->
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-1.5">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold text-white bg-black/80 px-1.5 py-0.5 rounded">#${idx + 1}</span>
                <button type="button" onclick="removePhotoAt(${idx})" class="w-5 h-5 bg-red-500/80 hover:bg-red-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold">×</button>
              </div>
              <div class="flex justify-center gap-1">
                ${idx > 0 ? `<button type="button" onclick="movePhoto(${idx}, ${idx - 1})" class="px-1.5 py-0.5 bg-white/20 hover:bg-white/40 text-white rounded text-[10px] font-bold" title="Déplacer vers la gauche">◀</button>` : ''}
                ${idx !== 0 ? `<button type="button" onclick="setMainPhoto(${idx})" class="px-1.5 py-0.5 bg-[#DF921B] text-black rounded text-[10px] font-bold" title="Définir comme photo principale">★</button>` : ''}
                ${idx < currentFormImages.length - 1 ? `<button type="button" onclick="movePhoto(${idx}, ${idx + 1})" class="px-1.5 py-0.5 bg-white/20 hover:bg-white/40 text-white rounded text-[10px] font-bold" title="Déplacer vers la droite">▶</button>` : ''}
              </div>
            </div>
          </div>
        `).join('');

        // Attach HTML5 Drag and Drop events
        let dragSourceIdx = null;
        document.querySelectorAll('.photo-draggable-item').forEach(item => {
          item.addEventListener('dragstart', (e) => {
            dragSourceIdx = parseInt(item.dataset.idx, 10);
            e.dataTransfer.effectAllowed = 'move';
            item.classList.add('opacity-40');
          });

          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
          });

          item.addEventListener('dragenter', () => {
            item.classList.add('border-[#DF921B]', 'scale-105');
          });

          item.addEventListener('dragleave', () => {
            item.classList.remove('border-[#DF921B]', 'scale-105');
          });

          item.addEventListener('drop', (e) => {
            e.preventDefault();
            item.classList.remove('border-[#DF921B]', 'scale-105');
            const targetIdx = parseInt(item.dataset.idx, 10);
            if (dragSourceIdx !== null && dragSourceIdx !== targetIdx) {
              const movedItem = currentFormImages.splice(dragSourceIdx, 1)[0];
              currentFormImages.splice(targetIdx, 0, movedItem);
              renderPhotoReorderGrid();
            }
          });

          item.addEventListener('dragend', () => {
            item.classList.remove('opacity-40');
          });
        });
      }

      window.movePhoto = function(fromIdx, toIdx) {
        if (toIdx < 0 || toIdx >= currentFormImages.length) return;
        const item = currentFormImages.splice(fromIdx, 1)[0];
        currentFormImages.splice(toIdx, 0, item);
        renderPhotoReorderGrid();
      };

      window.setMainPhoto = function(idx) {
        if (idx === 0) return;
        const item = currentFormImages.splice(idx, 1)[0];
        currentFormImages.unshift(item);
        renderPhotoReorderGrid();
      };

      window.removePhotoAt = function(idx) {
        currentFormImages.splice(idx, 1);
        renderPhotoReorderGrid();
      };

      const btnAddPhoto = document.getElementById('btn-add-photo');
      const inputAddPhoto = document.getElementById('form-image-input');
      if (btnAddPhoto && inputAddPhoto) {
        btnAddPhoto.addEventListener('click', () => {
          const val = inputAddPhoto.value.trim();
          if (val) {
            const urls = val.split(',').map(s => s.trim()).filter(Boolean);
            currentFormImages.push(...urls);
            inputAddPhoto.value = '';
            renderPhotoReorderGrid();
          }
        });
      }

      function renderTable() {
        const props = getAllProperties();
        if (props.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="6" class="p-8 text-center text-zinc-500 font-semibold">
                No property listings found. Click "+ Add New Property" above to create your first listing.
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = props.map(p => `
          <tr class="hover:bg-white/5">
            <td class="p-4 flex items-center gap-3">
              <img src="${(Array.isArray(p.images) && p.images[0]) ? p.images[0] : (p.image || '/public/images/villa_1.png')}" class="w-12 h-9 rounded-lg object-cover border border-white/10">
              <div>
                <span class="font-bold text-white block">${p.title}</span>
                <span class="text-[10px] text-zinc-400 font-mono">${Array.isArray(p.images) ? p.images.length : 1} photos</span>
              </div>
            </td>
            <td class="p-4">${p.type || 'Villa'}</td>
            <td class="p-4">${p.district || 'Phuket'}</td>
            <td class="p-4 uppercase font-bold text-[#DF921B] text-[10px]">${p.purpose || 'buy'}</td>
            <td class="p-4 font-bold">${Number(p.price || p.price_thb).toLocaleString()} ฿</td>
            <td class="p-4 text-right space-x-2">
              <button onclick="editListing('${p.id || p.slug}')" class="text-zinc-300 hover:text-white font-bold text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">Edit Photos</button>
              <button onclick="deleteListing('${p.id || p.slug}')" class="text-red-400 hover:text-red-300 font-bold text-xs bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition">Delete</button>
            </td>
          </tr>
        `).join('');
      }

      window.editListing = function(id) {
        const props = getAllProperties();
        const p = props.find(item => item.id === id || item.slug === id);
        if (!p) return;

        document.getElementById('form-prop-id').value = p.id;
        document.getElementById('modal-title').textContent = `Edit Listing: ${p.title}`;
        document.getElementById('form-title').value = p.title || '';
        document.getElementById('form-type').value = p.type || 'Villa';
        document.getElementById('form-purpose').value = p.purpose || 'rent';
        document.getElementById('form-district').value = p.district || 'Rawai';
        document.getElementById('form-price').value = p.price_thb || p.price || 0;
        document.getElementById('form-bedrooms').value = p.bedrooms || 0;
        document.getElementById('form-bathrooms').value = p.bathrooms || 0;
        document.getElementById('form-guests').value = p.guests || 4;
        document.getElementById('form-beds').value = p.beds || 2;
        document.getElementById('form-rating').value = p.rating || 4.9;
        document.getElementById('form-review-count').value = p.review_count || 12;
        document.getElementById('form-area').value = p.building_area || 0;
        document.getElementById('form-desc').value = p.description || '';
        document.getElementById('form-pool').checked = !!p.private_pool;
        document.getElementById('form-seaview').checked = !!p.sea_view;
        document.getElementById('form-parking').checked = p.private_parking !== false;

        currentFormImages = Array.isArray(p.images) ? [...p.images] : (p.image ? [p.image] : []);
        renderPhotoReorderGrid();

        modal.classList.remove('hidden');
      };

      window.deleteListing = function(id) {
        if (!confirm('Are you sure you want to delete this listing?')) return;
        let props = getAllProperties().filter(p => p.id !== id && p.slug !== id);
        saveProperties(props);
        renderTable();
      };

      btnOpenAdd.addEventListener('click', () => {
        form.reset();
        document.getElementById('form-prop-id').value = '';
        document.getElementById('modal-title').textContent = 'Add Property';
        currentFormImages = [];
        renderPhotoReorderGrid();
        modal.classList.remove('hidden');
      });

      btnCloseModal.addEventListener('click', () => modal.classList.add('hidden'));
      btnCancel.addEventListener('click', () => modal.classList.add('hidden'));

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const existingId = document.getElementById('form-prop-id').value;
        const id = existingId || ('PVC-' + Date.now().toString().slice(-4));
        
        const newProp = {
          id: id,
          slug: 'pvc-' + id.toLowerCase(),
          title: document.getElementById('form-title').value,
          type: document.getElementById('form-type').value,
          purpose: document.getElementById('form-purpose').value,
          district: document.getElementById('form-district').value,
          price: Number(document.getElementById('form-price').value) || 0,
          price_thb: Number(document.getElementById('form-price').value) || 0,
          bedrooms: Number(document.getElementById('form-bedrooms').value) || 0,
          bathrooms: Number(document.getElementById('form-bathrooms').value) || 0,
          guests: Number(document.getElementById('form-guests').value) || 4,
          beds: Number(document.getElementById('form-beds').value) || 2,
          rating: Number(document.getElementById('form-rating').value) || 4.9,
          review_count: Number(document.getElementById('form-review-count').value) || 12,
          building_area: Number(document.getElementById('form-area').value) || 0,
          images: currentFormImages.length > 0 ? [...currentFormImages] : ['/public/images/villa_1.png'],
          image: currentFormImages[0] || '/public/images/villa_1.png',
          description: document.getElementById('form-desc').value,
          private_pool: document.getElementById('form-pool').checked,
          sea_view: document.getElementById('form-seaview').checked,
          private_parking: document.getElementById('form-parking').checked
        };

        let props = getAllProperties();
        if (existingId) {
          props = props.map(item => (item.id === existingId || item.slug === existingId) ? { ...item, ...newProp } : item);
        } else {
          props.unshift(newProp);
        }

        saveProperties(props);
        modal.classList.add('hidden');
        renderTable();
      });

      renderTable();
    });
  </script>
</body>
</html>
